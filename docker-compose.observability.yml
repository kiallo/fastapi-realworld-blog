services:
  prometheus:
    # 版本写死，不用 latest：面板 JSON 的 schemaVersion 跟版本走，
    # latest 某天升级后你的面板可能打不开。
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      # 只留 7 天：压测数据量不大，但笔记本的磁盘更小
    extra_hosts:
      # Linux 上 host.docker.internal 不存在，这一行让它存在；
      # Windows / macOS 的 Docker Desktop 自带，加了也无害。
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 只绑回环 + 强密码：Grafana 的默认口令是 admin/admin，
      # 而它默认允许匿名查看。两条加起来就是一个公网可读的监控面板。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 必须设置}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: