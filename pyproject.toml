[project]
name = "fastapi-realworld-blog"
version = "0.1.0"
description = "一个符合 RealWorld 规范的博客 API"
authors = [
    {name = "kiallo@163.com"}
]
license = "MIT"
requires-python = ">=3.9,<4.0"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fastapi = ">=0.115.0,<1.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic = { version = ">=2.0", extras = ["email"] }
pydantic-settings = ">=2.0"
python-slugify = ">=8.0"
loguru = ">=0.7.0"

# 数据库
databases = ">=0.9.0"
asyncpg = ">=0.29.0"
psycopg2-binary = ">=2.9.0"
aiosql = ">=10.0"
pypika = ">=0.48.0"
alembic = ">=1.13.0"

# 安全
passlib = { version = ">=1.7.0", extras = ["bcrypt"] }
pyjwt = ">=2.8.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"
asgi-lifespan = ">=2.1.0"
black = ">=24.0"
isort = ">=5.13.0"
mypy = ">=1.8.0"
autoflake = ">=2.2.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 100
target-version = ["py39"]


[tool.isort]
profile = "black"
line_length = 100


[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true